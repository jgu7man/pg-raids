<h3 mat-dialog-title>
    Agrega tu nick name
</h3>

<mat-dialog-content>
    <mat-form-field>
        <mat-label>Nickname</mat-label>
        <input
        matInput
        type="text"
        [(ngModel)]="member.nickname"
        name="nickname"
        #nickname="ngModel"
        required
        >
        <mat-error *ngIf="nickname.invalid
        || (nickname.dirty && nickname.touched)">
            Es necesario que agregues tu nickname del juego para que puedas participar
        </mat-error>
    </mat-form-field>
    <mat-form-field>
        <mat-label>Código de amistad</mat-label>
        <input
        matInput
        type="text"
        [(ngModel)]="member.pg_code"
        name="pg_code"
        >
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions
style="display: flex; justify-content: center;">
    <button mat-raised-button
    color="primary"
    (click)="onSave()"
    >Guardar</button>
</mat-dialog-actions>
